<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2370" viewBox="0 0 1200 2370"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">NIO 核心知识</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">少量线程等待多连接；状态、分帧、续写与资源仍由应用管理</tspan></text><rect x="30" y="120" width="1140" height="165" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  NIO 真正解决的问题</tspan></text><rect x="55" y="190" width="500" height="60" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">BIO：常见设计为每个连接阻塞等待</tspan></text><rect x="610" y="190" width="530" height="60" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">NIO：Selector 等待一组连接就绪</tspan></text><text x="56" y="272" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">非阻塞网络模型不意味着所有方法与业务逻辑永不阻塞。</tspan></text><rect x="30" y="305" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="305" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="341" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  核心对象与就绪事件</tspan></text><rect x="55" y="380" width="250" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="414" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">Channel｜通道</tspan></text><rect x="335" y="380" width="250" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="353" y="414" font-size="22" fill="#15345e" font-weight="700"><tspan x="353" dy="0">Buffer｜数据容器</tspan></text><rect x="615" y="380" width="250" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="633" y="414" font-size="22" fill="#15345e" font-weight="700"><tspan x="633" dy="0">Selector｜选择器</tspan></text><rect x="895" y="380" width="250" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="913" y="414" font-size="22" fill="#15345e" font-weight="700"><tspan x="913" dy="0">Key｜注册关系</tspan></text><text x="56" y="481" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">关注 ACCEPT / CONNECT / READ / WRITE；CONNECT 就绪仍需 finishConnect。</tspan></text><rect x="30" y="520" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="520" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="556" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  服务端启动流程</tspan></text><rect x="55" y="595" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="629" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">打开、绑定、非阻塞</tspan></text><path d="M375,627 L420,627" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="595" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="629" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">注册 OP_ACCEPT</tspan></text><path d="M750,627 L800,627" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="595" width="335" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="629" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">select 与处理就绪项</tspan></text><text x="56" y="698" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">移除已处理 Key 不等于取消注册；读写可同时就绪，处理前检查有效性。</tspan></text><text x="56" y="725" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">select 返回更新的 Key 数量，不是消息数；selectedKeys 不自动清空。</tspan></text><rect x="30" y="745" width="1140" height="165" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="745" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="781" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  接受连接：OP_ACCEPT</tspan></text><rect x="55" y="818" width="520" height="60" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="852" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">监听 Channel 就绪：程序调用 accept</tspan></text><rect x="610" y="818" width="530" height="60" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="852" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">连接 Channel 非阻塞后注册 OP_READ</tspan></text><text x="56" y="902" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">Selector 只报告就绪；非阻塞 accept 仍可能返回 null。</tspan></text><rect x="30" y="930" width="1140" height="240" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="930" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="966" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  读取：OP_READ</tspan></text><rect x="55" y="1005" width="335" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1039" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">read &gt; 0：读入字节</tspan></text><rect x="430" y="1005" width="340" height="70" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="1039" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">read = 0：本次未读入</tspan></text><text x="448" y="1069" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">检查数据与 Buffer 空间</tspan></text><rect x="810" y="1005" width="335" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="1039" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">read = −1：输入结束</tspan></text><text x="56" y="1114" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">每连接保存半包状态；flip 准备读，compact 保留未完成末尾。</tspan></text><text x="56" y="1146" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">不要在下一轮 clear 覆盖半包；EOF 可作单请求结束，但不适合反复长连接。</tspan></text><rect x="30" y="1190" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1190" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1226" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  写入：OP_WRITE 不是“我想写就注册”</tspan></text><rect x="55" y="1264" width="310" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1298" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">先直接 write</tspan></text><path d="M375,1298 L420,1298" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="1264" width="310" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="1298" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">未写完：保存剩余数据</tspan></text><path d="M750,1298 L800,1298" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="1264" width="335" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="1298" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">关注 OP_WRITE 并续写</tspan></text><text x="56" y="1373" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">写完移除 OP_WRITE，否则可能空转；队列有界，压力应反馈到真正生产源。</tspan></text><rect x="30" y="1420" width="1140" height="165" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1420" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1456" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  Selector 事件循环与线程模型</tspan></text><rect x="55" y="1493" width="520" height="60" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1527" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">网络循环保持短小：等待、分派、清理</tspan></text><rect x="610" y="1493" width="530" height="60" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="628" y="1527" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">慢业务交给业务线程或异步机制</tspan></text><text x="56" y="1576" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">每连接状态明确线程归属；跨线程修改需同步或回到所属事件线程。</tspan></text><rect x="30" y="1605" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1605" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1641" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">8  NIO 与 BIO 对比</tspan></text><text x="56" y="1702" font-size="22" fill="#15345e" font-weight="400"><tspan x="56" dy="0">BIO：阻塞读写；NIO：就绪通知后尝试读写，部分结果由后续继续。</tspan></text><text x="56" y="1738" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">interestOps | OP_WRITE 打开写关注；与 ~OP_WRITE 按位与关闭写关注。</tspan></text><text x="56" y="1767" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">修改指定事件位，不覆盖其他仍需关注的事件。</tspan></text><rect x="30" y="1800" width="1140" height="165" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1800" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1836" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">9  常见错误</tspan></text><text x="56" y="1895" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">误把 0 当 EOF、常驻写关注、丢弃剩余 Buffer、共享半包状态、慢业务阻塞。</tspan></text><text x="56" y="1932" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">再检查阻塞注册、selectedKeys 清理、无限队列与关注位覆盖。</tspan></text><rect x="30" y="1985" width="1140" height="145" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1985" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="2021" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">10  与 TCP、BIO、Netty 的关系</tspan></text><text x="56" y="2078" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">TCP 是协议；BIO / NIO 是 I/O 模型；Netty 封装事件循环、处理链与资源。</tspan></text><text x="56" y="2115" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">NIO 改变等待方式，不消除消息边界、慢客户端与背压问题。</tspan></text><rect x="30" y="2150" width="1140" height="130" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="2150" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="2186" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">11  自测与答案</tspan></text><text x="56" y="2243" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">保留全部10道自测与答案，覆盖连接、就绪、读取、续写和线程。</tspan></text><text x="47" y="2333" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：就绪不等于完成；每连接状态必须能跨事件保留。</tspan></text></g></svg>