<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2100" viewBox="0 0 1200 2100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">事务原理｜redo、undo 与提交边界</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">从内存修改到故障恢复：先看保障，再分清状态与清理条件</tspan></text><rect x="30" y="120" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  事务特性与日志职责</tspan></text><rect x="55" y="190" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">原子性：undo</tspan></text><text x="73" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">撤销本事务修改</tspan></text><rect x="430" y="190" width="335" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">持久性：redo</tspan></text><text x="448" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">恢复已提交修改</tspan></text><rect x="805" y="190" width="335" height="78" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="823" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="823" dy="0">隔离性：锁 / MVCC</tspan></text><text x="823" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="823" dy="0">控制并发影响</tspan></text><text x="56" y="293" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">一致性仍需约束与正确业务规则；日志不能替业务代码表达转账规则。</tspan></text><rect x="30" y="325" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="325" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="361" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  为什么需要 redo log</tspan></text><rect x="55" y="395" width="500" height="73" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="429" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">Buffer Pool 修改数据页</tspan></text><text x="73" y="459" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">形成脏页；每次提交刷整页成本高</tspan></text><rect x="625" y="395" width="520" height="73" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="643" y="429" font-size="22" fill="#15345e" font-weight="700"><tspan x="643" dy="0">redo 记录页修改信息</tspan></text><text x="643" y="459" font-size="19" fill="#15345e" font-weight="400"><tspan x="643" dy="0">以顺序追加为主，降低提交等待</tspan></text><text x="56" y="497" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">先保证必要日志持久化，数据页择机写回；redo 不是 SQL 副本或刷页线程。</tspan></text><rect x="30" y="530" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="530" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="566" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  redo log 的位置与提交流程</tspan></text><rect x="55" y="604" width="325" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="638" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">redo log buffer</tspan></text><text x="73" y="668" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">进程内存，进程退出可丢失</tspan></text><rect x="435" y="604" width="325" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="453" y="638" font-size="22" fill="#15345e" font-weight="700"><tspan x="453" dy="0">操作系统缓存</tspan></text><text x="453" y="668" font-size="19" fill="#15345e" font-weight="400"><tspan x="453" dy="0">系统崩溃或断电可丢失</tspan></text><rect x="815" y="604" width="325" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="833" y="638" font-size="22" fill="#15345e" font-weight="700"><tspan x="833" dy="0">持久化存储</tspan></text><text x="833" y="668" font-size="19" fill="#15345e" font-weight="400"><tspan x="833" dy="0">同步完成后用于故障恢复</tspan></text><path d="M382,642 L430,642" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M762,642 L810,642" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="716" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">默认配置 1：提交前保证 redo 持久化；不要求修改后的数据页已经落盘。</tspan></text><text x="56" y="739" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">响应丢失会使客户端结果不确定；超时不能直接当成回滚。</tspan></text><rect x="30" y="765" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="765" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="801" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  落盘不等于提交：WAL 与未提交数据页</tspan></text><rect x="55" y="840" width="325" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="874" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">redo 落盘</tspan></text><text x="73" y="904" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">日志可靠保存</tspan></text><rect x="435" y="840" width="325" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="453" y="874" font-size="22" fill="#15345e" font-weight="700"><tspan x="453" dy="0">数据页落盘</tspan></text><text x="453" y="904" font-size="19" fill="#15345e" font-weight="400"><tspan x="453" dy="0">页内容写入数据文件</tspan></text><rect x="815" y="840" width="325" height="75" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="833" y="874" font-size="22" fill="#15345e" font-weight="700"><tspan x="833" dy="0">事务提交</tspan></text><text x="833" y="904" font-size="19" fill="#15345e" font-weight="400"><tspan x="833" dy="0">确认这组操作正式生效</tspan></text><text x="56" y="952" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">WAL：刷数据页前，先保证对应 redo 持久化。未提交数据页也可以落盘。</tspan></text><text x="56" y="980" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">余额 100 改 80 未提交即崩溃：恢复仍需撤销该事务，不能只丢弃内存。</tspan></text><rect x="30" y="1010" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1010" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1046" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  redo log 刷盘策略</tspan></text><rect x="55" y="1085" width="335" height="92" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1119" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">1｜默认</tspan></text><text x="73" y="1149" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">提交时写出并刷盘</tspan><tspan x="73" dy="23.75">相关 redo 持久化后成功</tspan></text><rect x="430" y="1085" width="335" height="92" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="1119" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">2｜提交时写出</tspan></text><text x="448" y="1149" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">先到操作系统缓存</tspan><tspan x="448" dy="23.75">通常约每秒刷盘</tspan></text><rect x="805" y="1085" width="335" height="92" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="823" y="1119" font-size="22" fill="#15345e" font-weight="700"><tspan x="823" dy="0">0｜提交不要求写出</tspan></text><text x="823" y="1149" font-size="19" fill="#15345e" font-weight="400"><tspan x="823" dy="0">通常约每秒</tspan><tspan x="823" dy="23.75">写出并刷盘</tspan></text><text x="56" y="1215" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">0、2 可能丢近期已提交修改；“约每秒”受配置与调度影响，并非严格上限。</tspan></text><text x="56" y="1246" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">1 的保障以设备正确兑现刷盘为前提；图示为逻辑层次，具体 I/O 路径可不同。</tspan></text><rect x="30" y="1275" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1275" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1311" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  undo log：如何撤销修改</tspan></text><rect x="55" y="1350" width="520" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1384" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">insert undo｜INSERT</tspan></text><text x="73" y="1414" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">用于回滚；提交后即可释放</tspan></text><rect x="625" y="1350" width="520" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="643" y="1384" font-size="22" fill="#15345e" font-weight="700"><tspan x="643" dy="0">update undo｜UPDATE / DELETE</tspan></text><text x="643" y="1414" font-size="19" fill="#15345e" font-weight="400"><tspan x="643" dy="0">用于回滚与 MVCC；提交后可能保留</tspan></text><text x="56" y="1461" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">undo 保存撤销所需信息，不是简单的反向 SQL；普通持久表的 undo 页也受 redo 保护。</tspan></text><text x="56" y="1492" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">redo 记录 undo 页修改，不需要再为 redo 本身生成 undo，不存在无限递归。</tspan></text><rect x="30" y="1520" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1520" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1556" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">7  日志的清理与空间复用</tspan></text><rect x="55" y="1595" width="520" height="88" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1629" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">redo｜checkpoint 推进</tspan></text><text x="73" y="1659" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">相关页修改已持久化后</tspan><tspan x="73" dy="23.75">恢复不再需要的日志空间才能复用</tspan></text><rect x="625" y="1595" width="520" height="88" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="643" y="1629" font-size="22" fill="#15345e" font-weight="700"><tspan x="643" dy="0">undo｜purge 清理历史</tspan></text><text x="643" y="1659" font-size="19" fill="#15345e" font-weight="400"><tspan x="643" dy="0">已提交且不再被快照需要等条件满足</tspan><tspan x="643" dy="23.75">释放空间不代表文件立即缩小</tspan></text><text x="56" y="1721" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">长事务持有旧快照可阻碍历史清理，哪怕只读；不是执行 BEGIN 就必然阻碍。</tspan></text><text x="56" y="1753" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">事务提交不是 redo / update undo 能立即清理的充分条件。</tspan></text><rect x="30" y="1785" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1785" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1821" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">8  易混淆点</tspan></text><text x="56" y="1881" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">redo 持续产生，包含未提交修改；数据页先后刷盘与事务可见性分别判断。</tspan></text><text x="56" y="1923" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">提交成功不等于数据页落盘；回滚也不只是丢弃内存。</tspan></text><text x="56" y="1965" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">恢复需要 redo 与 undo 配合；业务规则正确还依赖约束和业务代码。</tspan></text><text x="47" y="2064" font-size="24" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习抓手：日志在哪里？事务提交了吗？历史还被谁需要？</tspan></text></g></svg>