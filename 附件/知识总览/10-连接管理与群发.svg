<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">10｜连接管理与群发</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">连接集合、发送目标与操作结果分别管理</tspan></text><rect x="30" y="120" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  ChannelGroup 管理连接集合</tspan></text><rect x="55" y="190" width="335" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">EventLoopGroup</tspan></text><text x="73" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">组织事件循环</tspan></text><rect x="430" y="190" width="340" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">ChannelGroup</tspan></text><text x="448" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">管理 Channel 集合</tspan></text><rect x="810" y="190" width="335" height="70" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">ChannelPipeline</tspan></text><text x="828" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">组织单连接处理步骤</tspan></text><text x="56" y="288" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">加入组不改变 EventLoop，也不共享 Pipeline；线程安全集合不等于业务安全。</tspan></text><rect x="30" y="325" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="325" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="361" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  在线集合的共享与生命周期</tspan></text><rect x="55" y="400" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="434" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">连接激活</tspan></text><text x="73" y="464" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">加入共享 online 集合</tspan></text><path d="M400,439 L420,439" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="400" width="340" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="434" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">进程内共享集合</tspan></text><text x="448" y="464" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">static 或统一持有与注入</tspan></text><path d="M780,439 L800,439" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="400" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="434" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">连接关闭</tspan></text><text x="828" y="464" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">DefaultChannelGroup 自动移除</tspan></text><text x="56" y="518" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">普通用户映射与队列仍需应用清理；手动 remove 不等于 close。</tspan></text><text x="56" y="541" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">GlobalEventExecutor 用于通知；连接 I/O 仍由各自 EventLoop 执行。</tspan></text><rect x="30" y="565" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="565" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="601" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  单发、广播与心跳分流</tspan></text><rect x="55" y="640" width="500" height="78" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="73" y="674" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">type=2：PING</tspan></text><text x="73" y="704" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">ctx.writeAndFlush，只回复发送方</tspan></text><rect x="590" y="640" width="550" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="608" y="674" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">其他类型：当前代码进入广播</tspan></text><text x="608" y="704" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">online.writeAndFlush，包含发送者</tspan></text><text x="56" y="758" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">每条业务只提交一次群发；当前并未显式限定只允许 type=1。</tspan></text><rect x="30" y="805" width="1140" height="240" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="805" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="841" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  ChannelGroupFuture 与失败目标</tspan></text><rect x="55" y="880" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="914" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">ChannelGroupFuture</tspan></text><text x="73" y="944" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">汇总本次各目标结果</tspan></text><rect x="430" y="880" width="340" height="78" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="914" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">遍历 ChannelFuture</tspan></text><text x="448" y="944" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">定位哪个目标写失败</tspan></text><rect x="810" y="880" width="335" height="78" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="828" y="914" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">原始 ctx 属于发送者</tspan></text><text x="828" y="944" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">直接关闭可能关错连接</tspan></text><text x="56" y="1001" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">组写成功不等于所有接收方业务完成；本地写结果与业务 ACK 分开。</tspan></text><text x="56" y="1032" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">源码目前只打印全部成功；逐目标失败处理是待实现的示例。</tspan></text><rect x="30" y="1065" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1065" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1101" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  同一个客户端程序建立多条连接</tspan></text><rect x="55" y="1140" width="500" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1174" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">客户端进程 A｜本地端口 A</tspan></text><rect x="610" y="1140" width="530" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="1174" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">客户端进程 B｜本地端口 B</tspan></text><text x="56" y="1250" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">都连接服务端 9094；无需复制客户端类，业务广播应以 type=1 消息验证。</tspan></text><rect x="30" y="1280" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1280" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1316" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  换行、重复输出与验证边界</tspan></text><rect x="55" y="1355" width="335" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1389" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">多一空行</tspan></text><text x="73" y="1419" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">检查正文与追加换行</tspan></text><rect x="430" y="1355" width="340" height="80" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="1389" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">内容重复</tspan></text><text x="448" y="1419" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">检查重复发送或连接</tspan></text><rect x="810" y="1355" width="335" height="80" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="828" y="1389" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">错误断开发送者</tspan></text><text x="828" y="1419" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">检查失败目标与 ctx</tspan></text><text x="56" y="1479" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">验收：双向广播、包含发送方、断开移组、失败隔离；本次未运行故障实验。</tspan></text><text x="47" y="1568" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：组里有什么？发给谁？谁失败？谁负责清理？</tspan></text></g></svg>