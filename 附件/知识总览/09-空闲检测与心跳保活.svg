<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">09｜空闲检测与心跳保活</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">观察 I/O 活动，由应用决定探测、关闭与恢复策略</tspan></text><rect x="30" y="120" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  空闲是观测结果，不是死亡证明</tspan></text><rect x="55" y="190" width="500" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">没有相应读写活动</tspan></text><text x="73" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">可能只是正常安静</tspan></text><rect x="590" y="190" width="550" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="608" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">应用策略：探测 / 观察 / 关闭</tspan></text><text x="56" y="280" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">空闲、PING/PONG、TCP keepalive 与业务 ACK 不能互相替代。</tspan></text><rect x="30" y="315" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="315" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="351" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  三类空闲条件与事件方向</tspan></text><rect x="55" y="390" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">READER_IDLE</tspan></text><text x="73" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">指定时段没有读活动</tspan></text><rect x="430" y="390" width="340" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">WRITER_IDLE</tspan></text><text x="448" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">指定时段没有写活动</tspan></text><rect x="810" y="390" width="335" height="78" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">ALL_IDLE</tspan></text><text x="828" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">指定时段读写都无活动</tspan></text><text x="56" y="506" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">三个整数参数单位为秒，0 禁用；IdleStateEvent 沿入站方向交给后续处理器。</tspan></text><text x="56" y="534" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">IdleStateHandler 不自动关闭连接；回调中由应用决定。</tspan></text><rect x="30" y="560" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="560" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="596" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  放置位置决定观察粒度</tspan></text><rect x="55" y="635" width="485" height="76" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="669" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">IdleStateHandler 在分帧器前</tspan></text><text x="73" y="699" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">不完整字节片段也可能更新读活动</tspan></text><rect x="580" y="635" width="560" height="76" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="598" y="669" font-size="22" fill="#15345e" font-weight="700"><tspan x="598" dy="0">当前配置 20 秒读空闲</tspan></text><text x="598" y="699" font-size="19" fill="#15345e" font-weight="400"><tspan x="598" dy="0">源码日志仍写 6 秒：以配置为准</tspan></text><text x="56" y="745" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">原始读取活动不等于完整合法业务消息；移动节点会改变观测语义。</tspan></text><rect x="30" y="780" width="1140" height="250" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="780" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="816" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  PING 与 PONG 的实际路径</tspan></text><rect x="55" y="855" width="310" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="889" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">客户端写空闲 10 秒</tspan></text><text x="73" y="919" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">发送 type=2 的 PING</tspan></text><path d="M375,894 L420,894" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="855" width="310" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="889" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">服务端读到字节</tspan></text><text x="448" y="919" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">更新读活动</tspan></text><path d="M750,894 L800,894" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="855" width="335" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="889" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">解码并识别 type=2</tspan></text><text x="828" y="919" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">只回复发送方 PONG</tspan></text><text x="56" y="978" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">请求：长度 + 类型 + 正文；回复：PONG + 换行，客户端按行接收。</tspan></text><text x="56" y="1009" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">正常业务活动也可保活；12 秒定时业务发送不是固定心跳周期。</tspan></text><rect x="30" y="1050" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1050" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1086" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  阈值余量与当前可靠性边界</tspan></text><rect x="55" y="1125" width="520" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">服务端 20 秒 / 客户端 10 秒</tspan></text><text x="73" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">为抖动、排队与执行延迟留出余量</tspan></text><rect x="610" y="1125" width="530" height="80" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">当前未实现 PONG 截止时间</tspan></text><text x="628" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">也未实现自动重连与会话恢复</tspan></text><text x="56" y="1244" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">定时器不是硬实时；本地发送成功不证明对端业务正常。</tspan></text><rect x="30" y="1285" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1285" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1321" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  正常关闭与验证场景</tspan></text><rect x="55" y="1360" width="335" height="76" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1394" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">正常远端结束</tspan></text><text x="73" y="1424" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">通常不必等空闲阈值</tspan></text><rect x="430" y="1360" width="340" height="76" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="1394" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">静默断网 / 黑洞</tspan></text><text x="448" y="1424" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">超时提供补充检测</tspan></text><rect x="810" y="1360" width="335" height="76" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="1394" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">测试时区分原因</tspan></text><text x="828" y="1424" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">协议错误不等于超时</tspan></text><text x="56" y="1479" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">验证：静默连接、PING/PONG、持续业务、无 PONG、主动关闭；本次未实测。</tspan></text><text x="47" y="1568" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：观测粒度 → 事件 → 应用策略 → 可靠性边界</tspan></text></g></svg>