<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">事务隔离级别：SQL 标准</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">先辨认并发现象，再读标准保障，最后核对数据库实现</tspan></text><rect x="30" y="120" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  隔离级别解决什么问题</tspan></text><rect x="55" y="190" width="520" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">哪些并发修改可以被看到？</tspan></text><rect x="610" y="190" width="530" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">并发执行能提供什么一致性保障？</tspan></text><text x="56" y="281" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">标准描述保障，数据库用 MVCC / 锁实现，Spring 提供配置入口。</tspan></text><rect x="30" y="315" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="315" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="351" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  三种并发现象</tspan></text><rect x="55" y="390" width="335" height="85" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">脏读：看提交状态</tspan></text><text x="73" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">读到别人未提交的修改</tspan></text><rect x="430" y="390" width="340" height="85" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">不可重复读：看已有数据</tspan></text><text x="448" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">别人提交后，同一数据重读变化</tspan></text><rect x="810" y="390" width="335" height="85" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">幻读：看符合条件的行集</tspan></text><text x="828" y="454" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">别人提交后，符合条件的集合变</tspan></text><text x="56" y="513" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">读自己未提交修改不是脏读；幻读不只看条数，行集变化也可能数量不变。</tspan></text><rect x="30" y="555" width="1140" height="345" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="555" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="591" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  四种标准隔离级别</tspan></text><rect x="55" y="625" width="385" height="43" rx="14" fill="#e3edff" stroke="#cbd9ec"/><text x="69" y="654" font-size="22" fill="#15345e" font-weight="700"><tspan x="69" dy="0">隔离级别</tspan></text><rect x="440" y="625" width="235" height="43" rx="14" fill="#e3edff" stroke="#cbd9ec"/><text x="454" y="654" font-size="22" fill="#15345e" font-weight="700"><tspan x="454" dy="0">脏读</tspan></text><rect x="675" y="625" width="235" height="43" rx="14" fill="#e3edff" stroke="#cbd9ec"/><text x="689" y="654" font-size="22" fill="#15345e" font-weight="700"><tspan x="689" dy="0">不可重复读</tspan></text><rect x="910" y="625" width="235" height="43" rx="14" fill="#e3edff" stroke="#cbd9ec"/><text x="924" y="654" font-size="22" fill="#15345e" font-weight="700"><tspan x="924" dy="0">幻读</tspan></text><rect x="55" y="668" width="385" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="69" y="697" font-size="21" fill="#15345e" font-weight="400"><tspan x="69" dy="0">RU｜读未提交</tspan></text><rect x="440" y="668" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="454" y="697" font-size="21" fill="#15345e" font-weight="400"><tspan x="454" dy="0">允许</tspan></text><rect x="675" y="668" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="689" y="697" font-size="21" fill="#15345e" font-weight="400"><tspan x="689" dy="0">允许</tspan></text><rect x="910" y="668" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="924" y="697" font-size="21" fill="#15345e" font-weight="400"><tspan x="924" dy="0">允许</tspan></text><rect x="55" y="712" width="385" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="69" y="741" font-size="21" fill="#15345e" font-weight="400"><tspan x="69" dy="0">RC｜读已提交</tspan></text><rect x="440" y="712" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="454" y="741" font-size="21" fill="#15345e" font-weight="400"><tspan x="454" dy="0">避免</tspan></text><rect x="675" y="712" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="689" y="741" font-size="21" fill="#15345e" font-weight="400"><tspan x="689" dy="0">允许</tspan></text><rect x="910" y="712" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="924" y="741" font-size="21" fill="#15345e" font-weight="400"><tspan x="924" dy="0">允许</tspan></text><rect x="55" y="756" width="385" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="69" y="785" font-size="21" fill="#15345e" font-weight="400"><tspan x="69" dy="0">RR｜可重复读</tspan></text><rect x="440" y="756" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="454" y="785" font-size="21" fill="#15345e" font-weight="400"><tspan x="454" dy="0">避免</tspan></text><rect x="675" y="756" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="689" y="785" font-size="21" fill="#15345e" font-weight="400"><tspan x="689" dy="0">避免</tspan></text><rect x="910" y="756" width="235" height="44" rx="14" fill="#ffffff" stroke="#cbd9ec"/><text x="924" y="785" font-size="21" fill="#15345e" font-weight="400"><tspan x="924" dy="0">标准允许</tspan></text><rect x="55" y="800" width="385" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="69" y="829" font-size="21" fill="#15345e" font-weight="400"><tspan x="69" dy="0">SERIALIZABLE</tspan></text><rect x="440" y="800" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="454" y="829" font-size="21" fill="#15345e" font-weight="400"><tspan x="454" dy="0">避免</tspan></text><rect x="675" y="800" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="689" y="829" font-size="21" fill="#15345e" font-weight="400"><tspan x="689" dy="0">避免</tspan></text><rect x="910" y="800" width="235" height="44" rx="14" fill="#f0f7ff" stroke="#cbd9ec"/><text x="924" y="829" font-size="21" fill="#15345e" font-weight="400"><tspan x="924" dy="0">避免</tspan></text><text x="56" y="880" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">允许 = 不保证避免，并非每次发生；串行化要求效果等价某种串行顺序。</tspan></text><rect x="30" y="920" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="920" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="956" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">4  从名称推导保障</tspan></text><rect x="55" y="995" width="250" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1029" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">未提交也看</tspan></text><rect x="335" y="995" width="250" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="353" y="1029" font-size="22" fill="#15345e" font-weight="700"><tspan x="353" dy="0">只看已提交</tspan></text><rect x="615" y="995" width="250" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="633" y="1029" font-size="22" fill="#15345e" font-weight="700"><tspan x="633" dy="0">重复读保持稳</tspan></text><rect x="895" y="995" width="250" height="67" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="913" y="1029" font-size="22" fill="#15345e" font-weight="700"><tspan x="913" dy="0">效果如串行</tspan></text><text x="56" y="1100" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">复习时先写：没提交、同一数据、一批行，再逐级推导保障表。</tspan></text><rect x="30" y="1145" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1145" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1181" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">5  标准保障与数据库实现的边界</tspan></text><text x="56" y="1239" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">数据库可以强于标准最低保障；标准允许幻读，不等于具体 RR 必然出现。</tspan></text><text x="56" y="1278" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">MySQL 还需区分快照读、锁定读与锁范围；三种现象不是所有异常清单。</tspan></text><text x="56" y="1316" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">本次未运行并发 SQL；验证需明确版本、隔离配置、语句类型与提交时序。</tspan></text><text x="47" y="1398" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：现象定义、标准最低保障、具体实现三层分开。</tspan></text></g></svg>