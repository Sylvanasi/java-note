<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2220" viewBox="0 0 1200 2220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">Spring 事务</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">同步调用与命令式事务：代理边界、回滚规则、传播范围</tspan></text><rect x="30" y="120" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  事务管理与 AOP 模型</tspan></text><rect x="55" y="190" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">调用进入 Service 代理</tspan></text><path d="M375,222 L420,222" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="190" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">开启 / 加入事务</tspan></text><path d="M750,222 L800,222" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="190" width="335" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">执行业务并完成事务</tspan></text><text x="56" y="280" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">数据库实际提交回滚，Spring 管理边界；提交阶段本身仍可能失败。</tspan></text><rect x="30" y="315" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="315" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="351" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  异常有没有经过事务拦截器</tspan></text><rect x="55" y="385" width="500" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">内部捕获并正常返回</tspan></text><text x="73" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">代理无法按该异常判断回滚</tspan></text><rect x="610" y="385" width="530" height="65" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">异常传出事务方法</tspan></text><text x="628" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">代理先处理，再到外层捕获</tspan></text><text x="56" y="475" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">捕获不保证提交：已有 rollback-only 或资源失败仍可能导致回滚。</tspan></text><rect x="30" y="510" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="510" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="546" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  默认与自定义回滚规则</tspan></text><rect x="55" y="585" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="619" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">普通默认规则</tspan></text><text x="73" y="649" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">RuntimeException / Error 回滚</tspan></text><rect x="430" y="585" width="340" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="619" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">rollbackFor</tspan></text><text x="448" y="649" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">增加匹配异常回滚规则</tspan></text><rect x="810" y="585" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="619" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">noRollbackFor</tspan></text><text x="828" y="649" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">匹配规则可排除回滚</tspan></text><text x="56" y="696" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">类规则按最具体匹配判断；受检异常默认不回滚，但异常仍可向外传播。</tspan></text><rect x="30" y="735" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="735" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="771" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  捕获异常后主动要求回滚</tspan></text><rect x="55" y="808" width="520" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="842" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">setRollbackOnly：标记当前事务范围</tspan></text><rect x="610" y="808" width="530" height="65" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="842" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">不立即回滚，也不终止方法</tspan></text><text x="56" y="897" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">普通共享事务与 NESTED 保存点范围需区分；不必然抛 UnexpectedRollback。</tspan></text><rect x="30" y="930" width="1140" height="150" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="930" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="966" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  传播行为总览与适用前提</tspan></text><text x="56" y="1026" font-size="22" fill="#15345e" font-weight="400"><tspan x="56" dy="0">先问：当前有事务吗？加入、挂起、新建、事务外执行还是保存点？</tspan></text><text x="56" y="1059" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">以下以同一事务管理器及代理调用为前提；挂起与保存点能力依赖管理器。</tspan></text><rect x="30" y="1100" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1100" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1136" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  共享事务与调用前置要求</tspan></text><rect x="55" y="1175" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1209" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">REQUIRED</tspan></text><text x="73" y="1239" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">有则加入，无则新建</tspan></text><rect x="430" y="1175" width="340" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="1209" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">SUPPORTS</tspan></text><text x="448" y="1239" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">有则加入，无则事务外执行</tspan></text><rect x="810" y="1175" width="335" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="1209" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">MANDATORY</tspan></text><text x="828" y="1239" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">必须已有事务，否则抛异常</tspan></text><text x="56" y="1280" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">共享物理事务的 rollback-only 会影响外层提交；内部返回不独立提交。</tspan></text><rect x="30" y="1315" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1315" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1351" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  独立事务与事务外执行</tspan></text><rect x="55" y="1390" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="1424" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">REQUIRES_NEW</tspan></text><text x="73" y="1454" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">挂起外层，新建独立事务</tspan></text><rect x="430" y="1390" width="340" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="1424" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">NOT_SUPPORTED</tspan></text><text x="448" y="1454" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">挂起外层，事务外执行</tspan></text><rect x="810" y="1390" width="335" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="1424" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">NEVER</tspan></text><text x="828" y="1454" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">禁止已有事务，否则抛异常</tspan></text><text x="56" y="1499" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">挂起不释放外层连接与锁；独立事务有连接池成本，异常仍可能向外传播。</tspan></text><rect x="30" y="1540" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1540" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1576" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">8  NESTED：局部回滚与保存点</tspan></text><rect x="55" y="1613" width="520" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1647" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">同一物理事务中的保存点</tspan></text><text x="73" y="1677" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">可局部撤销，不能独立提交</tspan></text><rect x="610" y="1613" width="530" height="65" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="1647" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">局部回退不能清除整体回滚标记</tspan></text><text x="56" y="1702" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">无事务时新建；JDBC 常用同连接保存点，需事务管理器支持。</tspan></text><rect x="30" y="1735" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1735" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1771" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">9  综合调用与 UnexpectedRollbackException</tspan></text><rect x="55" y="1810" width="520" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="1844" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">T1 + REQUIRES_NEW T2</tspan></text><text x="73" y="1874" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">外层捕获：A提交，B/C回滚</tspan></text><rect x="610" y="1810" width="530" height="75" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="628" y="1844" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">T1 + NESTED + REQUIRED</tspan></text><text x="628" y="1874" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">内层标记T1：A/B/C全回滚</tspan></text><text x="56" y="1920" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">外层正常返回欲提交，共享事务却只能回滚，可能抛 UnexpectedRollback。</tspan></text><rect x="30" y="1960" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1960" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1996" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">10  代理边界与事务增强失效</tspan></text><text x="56" y="2055" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">自调用、普通 new、private / static、类代理 final 等会绕过或限制增强。</tspan></text><text x="56" y="2091" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">自身注解不生效，不等于 SQL 没有外层事务；JDK 与类代理限制需区分。</tspan></text><text x="56" y="2126" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">本次核对规则，未重跑事务实验；以异常路径、代理及管理器配置判断结果。</tspan></text><text x="47" y="2187" font-size="22" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：异常经过谁？当前是哪笔事务？回滚标记属于哪里？</tspan></text></g></svg>