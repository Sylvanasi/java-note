<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">99｜易错点与排查索引</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">从现象定位证据，再按编号与专题深入查阅</tspan></text><rect x="30" y="120" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  协议、分帧与乱码</tspan></text><rect x="55" y="195" width="335" height="82" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="73" y="229" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">内容变短、类型变字符</tspan></text><text x="73" y="259" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">检查正文是否被消费</tspan></text><rect x="430" y="195" width="340" height="82" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="229" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">帧长异常</tspan></text><text x="448" y="259" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">检查原始长度字节</tspan></text><rect x="810" y="195" width="335" height="82" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="229" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">中文乱码</tspan></text><text x="828" y="259" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">先分帧，再核对 UTF-8</tspan></text><text x="56" y="320" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">sss + 换行可被误当成巨大长度；不要靠调大上限掩盖协议错配。</tspan></text><rect x="30" y="360" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="360" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="396" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  业务内容、重复发送与空行</tspan></text><rect x="55" y="435" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="469" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">时间戳不变</tspan></text><text x="73" y="499" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">检查对象创建时点</tspan></text><rect x="430" y="435" width="340" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="469" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">业务收到两份</tspan></text><text x="448" y="499" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">数群发调用与连接</tspan></text><rect x="810" y="435" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="469" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">多空行 / 只有 PONG</tspan></text><text x="828" y="499" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">查换行叠加与消息类型</tspan></text><text x="56" y="549" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">多行控制台输出不等于 TCP 重复投递；确认运行进程使用的是新代码。</tspan></text><rect x="30" y="585" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="585" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="621" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  线程、异步结果与关闭对象</tspan></text><rect x="55" y="660" width="335" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="694" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">main 返回但进程仍在</tspan></text><text x="73" y="724" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">检查非守护线程与资源</tspan></text><rect x="430" y="660" width="340" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="694" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">closeFuture 很快完成</tspan></text><text x="448" y="724" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">先确认监听哪个 Channel</tspan></text><rect x="810" y="660" width="335" height="80" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="694" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">传播返回、业务未打印</tspan></text><text x="828" y="724" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">可能已跨执行器排队</tspan></text><text x="56" y="783" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">finally 不是全异步链完成通知；普通连接断开不能关掉共享 workerGroup。</tspan></text><rect x="30" y="825" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="825" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="861" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  引用计数与资源生命周期</tspan></text><rect x="55" y="900" width="520" height="75" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="73" y="934" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">IllegalReferenceCountException</tspan></text><text x="73" y="964" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">排查提前释放、重复释放、自动释放</tspan></text><rect x="610" y="900" width="530" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="934" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">返回时 refCnt 仍为 2</tspan></text><text x="628" y="964" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">看谁仍持有，不直接认定泄漏</tspan></text><text x="56" y="1010" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">Java 变量增加不等于 retain；解码为独立对象后不必保留原始缓冲区。</tspan></text><rect x="30" y="1045" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1045" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1081" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  配置、日志与源码核对</tspan></text><rect x="55" y="1118" width="520" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1152" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">真实 IdleStateHandler 参数：20 秒</tspan></text><rect x="610" y="1118" width="530" height="65" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="1152" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">日志字符串可能仍写：6 秒</tspan></text><text x="56" y="1210" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">参数和日志是不同代码；同时核对真实配置、运行实例与显示文案。</tspan></text><rect x="30" y="1245" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1245" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1281" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  统一排查顺序与专题入口</tspan></text><rect x="55" y="1320" width="335" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1354" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">1 进程与版本</tspan></text><text x="73" y="1384" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">2 Channel 与方向</tspan></text><rect x="430" y="1320" width="340" height="72" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1354" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">3 原始字节范围</tspan></text><text x="448" y="1384" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">4 字段与读索引</tspan></text><rect x="810" y="1320" width="335" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="1354" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">5 业务与发送次数</tspan></text><text x="828" y="1384" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">6 线程、结果与关闭</tspan></text><path d="M400,1356 L420,1356" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,1356 L800,1356" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="1437" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">协议看 07 / 08；线程看 03 / 04；Future 看 05；内存看 06。</tspan></text><text x="56" y="1467" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">心跳看 09；群发看 10；写缓冲与背压看 11。历史故障本次未逐一复现。</tspan></text><text x="47" y="1545" font-size="22" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：现象只是线索，字节、调用次数、线程与结果才是证据。</tspan></text></g></svg>