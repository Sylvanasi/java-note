<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="52" font-size="28" fill="#15345e" font-weight="700"><tspan x="45" dy="0">MVCC｜版本、读视图与并发读取</tspan></text><text x="47" y="92" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">Read View 判断可见性；记录提供数据；undo 按需重建历史</tspan></text><rect x="30" y="120" width="1140" height="170" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  MVCC 解决什么问题</tspan></text><rect x="55" y="190" width="320" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">修改：100 改成 80</tspan></text><rect x="440" y="190" width="320" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="458" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="458" dy="0">保留历史信息</tspan></text><rect x="825" y="190" width="320" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="843" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="843" dy="0">快照仍可读 100</tspan></text><path d="M385,222 L430,222" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M770,222 L815,222" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="310" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="310" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="346" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">2  版本链：旧版本怎么找到</tspan></text><rect x="55" y="385" width="300" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">80｜事务24</tspan></text><text x="73" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">当前记录：检查可见性</tspan></text><rect x="450" y="385" width="300" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="468" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="468" dy="0">100｜事务16</tspan></text><text x="468" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="468" dy="0">由 undo 重建</tspan></text><rect x="845" y="385" width="300" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="863" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="863" dy="0">200｜事务12</tspan></text><text x="863" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="863" dy="0">仍不可见时继续找</tspan></text><path d="M365,422 L440,422" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M760,422 L835,422" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="55" y="490" font-size="20" fill="#15345e" font-weight="400"><tspan x="55" dy="0">DB_TRX_ID 用来判断；DB_ROLL_PTR 指向 undo；首个可见版本即返回。</tspan></text><rect x="30" y="530" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="530" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="566" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">3  Read View：记录事务信息，不保存表的副本</tspan></text><text x="55" y="622" font-size="22" fill="#15345e" font-weight="400"><tspan x="55" dy="0">创建者30｜其他活跃事务 [24,27]｜下界24｜上界31</tspan></text><text x="55" y="663" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">同一视图可用于多字段、多行、多张 InnoDB 表；读取时才按需访问数据。</tspan></text><rect x="30" y="730" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="730" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="766" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  可见性：把版本事务编号与读视图对照</tspan></text><rect x="55" y="800" width="520" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="834" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">自己修改的版本可见</tspan></text><text x="73" y="864" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">小于下界：创建视图前已提交</tspan></text><rect x="610" y="800" width="530" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="834" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">大于等于上界：不可见</tspan></text><text x="628" y="864" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">位于区间内：查活跃列表</tspan></text><text x="55" y="904" font-size="20" fill="#15345e" font-weight="400"><tspan x="55" dy="0">区间内在列表中不可见，不在则可见；旧视图不会因后来提交而刷新。</tspan></text><rect x="30" y="940" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="940" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="976" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  隔离级别：何时创建、是否复用</tspan></text><rect x="55" y="1010" width="520" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1044" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">读已提交</tspan></text><text x="73" y="1074" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">每条快照查询建立新视图</tspan></text><rect x="610" y="1010" width="530" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="1044" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">可重复读</tspan></text><text x="628" y="1074" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">首次快照读建立，后续复用</tspan></text><rect x="30" y="1140" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1140" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1176" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  快照读、当前读与自身修改可见</tspan></text><text x="55" y="1231" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">普通查询：按快照选版本；加锁读取与目标记录更新：按当前记录处理。</tspan></text><text x="55" y="1271" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">余额例子：查100；别人提交80；再查仍100；自己扣10；再查70。</tspan></text><text x="55" y="1311" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">视图未变，70 属于自身修改而可见；单条更新原子 ≠ 先查再改并发安全。</tspan></text><rect x="30" y="1390" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1390" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1426" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  幻读：区分标准与 InnoDB 的读取场景</tspan></text><rect x="55" y="1460" width="520" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1494" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">连续快照读：MVCC</tspan></text><text x="73" y="1524" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">别人新插入的记录对旧视图不可见</tspan></text><rect x="610" y="1460" width="530" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="1494" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">加锁读取：保护查询范围</tspan></text><text x="628" y="1524" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">所需范围锁阻止冲突插入</tspan></text><text x="55" y="1570" font-size="20" fill="#15345e" font-weight="400"><tspan x="55" dy="0">自身修改 / 切换读取方式导致结果变化，不直接当作经典幻读反例。</tspan></text><rect x="30" y="1610" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1610" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1646" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">8  锁与串行化：比稳定快照更强的保障</tspan></text><text x="55" y="1701" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">共享锁可与共享锁兼容；排他锁与其他事务的共享锁、排他锁冲突。</tspan></text><text x="55" y="1741" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">串行化多语句事务：普通查询也加共享锁；冲突写入需等待。</tspan></text><text x="55" y="1781" font-size="21" fill="#15345e" font-weight="400"><tspan x="55" dy="0">目标：执行效果等价某个串行顺序；并非全库只能运行一个事务。</tspan></text></g></svg>