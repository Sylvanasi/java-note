<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">07｜自定义协议与出站编码</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">对象如何成为字节，双方如何约定边界</tspan></text><rect x="30" y="120" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  对象与应用协议</tspan></text><rect x="55" y="190" width="300" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">ChatMessage 对象</tspan></text><path d="M365,225 L425,225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="435" y="190" width="300" height="70" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="453" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="453" dy="0">出站编码器</tspan></text><path d="M745,225 L805,225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="815" y="190" width="330" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="833" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="833" dy="0">ByteBuf 中的字节</tspan></text><text x="56" y="295" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">type=1 业务，type=2 应用 PING；手写协议不要求实现 Serializable。</tspan></text><rect x="30" y="330" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="330" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="366" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  帧结构与长度含义</tspan></text><rect x="55" y="405" width="340" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="439" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">长度 N｜4 字节整数</tspan></text><rect x="395" y="405" width="270" height="70" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="413" y="439" font-size="22" fill="#15345e" font-weight="700"><tspan x="413" dy="0">类型｜1 字节</tspan></text><rect x="665" y="405" width="480" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="683" y="439" font-size="22" fill="#15345e" font-weight="700"><tspan x="683" dy="0">正文｜UTF-8 字节</tspan></text><text x="56" y="514" font-size="22" fill="#15345e" font-weight="400"><tspan x="56" dy="0">N = 1 + 正文字节数；整帧 = 4 + N；N 不包含长度字段自身。</tspan></text><rect x="30" y="555" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="555" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="591" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">3  用字节数计算，不能用字符数</tspan></text><rect x="55" y="630" width="335" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="664" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">hello</tspan></text><text x="73" y="694" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">正文 5 字节，N=6，整帧 10</tspan></text><rect x="430" y="630" width="340" height="80" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="664" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">你好</tspan></text><text x="448" y="694" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">正文 6 字节，N=7，整帧 11</tspan></text><rect x="810" y="630" width="335" height="80" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="664" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">空字符串</tspan></text><text x="828" y="694" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">正文 0 字节，N=1，整帧 5</tspan></text><text x="56" y="751" font-size="22" fill="#15345e" font-weight="400"><tspan x="56" dy="0">hello 字段：00 00 00 06  |  01  |  68 65 6c 6c 6f</tspan></text><rect x="30" y="790" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="790" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="826" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">4  MessageToByteEncoder 的职责</tspan></text><rect x="55" y="865" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="899" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">writeInt</tspan></text><text x="73" y="929" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">追加长度 N</tspan></text><rect x="430" y="865" width="340" height="75" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="448" y="899" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">writeByte</tspan></text><text x="448" y="929" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">追加类型</tspan></text><rect x="810" y="865" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="899" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">writeBytes</tspan></text><text x="828" y="929" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">追加 UTF-8 正文</tspan></text><path d="M400,902 L420,902" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,902 L800,902" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="979" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">同一个 out 连续追加；框架负责后续出站交接，不在 encode 中释放 out。</tspan></text><text x="56" y="1006" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">只处理匹配消息类型；编码器须位于业务写操作可到达的路径。</tspan></text><rect x="30" y="1035" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1035" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1071" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">5  缓冲区写入与网络发送的区别</tspan></text><rect x="55" y="1109" width="500" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1143" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">三次 ByteBuf 写方法</tspan></text><text x="73" y="1173" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">不等于三次 Socket 发送</tspan></text><rect x="590" y="1109" width="550" height="70" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="608" y="1143" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">TCP 分段与接收端读取</tspan></text><text x="608" y="1173" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">不与编码语句一一对应</tspan></text><text x="56" y="1215" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">一次接收可能含多帧；一帧也可能分多次到达，接收端必须恢复边界。</tspan></text><rect x="30" y="1250" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1250" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1286" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">6  两个方向分别配套</tspan></text><rect x="55" y="1325" width="500" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1359" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">客户端请求服务端</tspan></text><text x="73" y="1389" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">长度 + 类型 + UTF-8 正文</tspan></text><path d="M565,1364 L605,1364" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="615" y="1325" width="525" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="633" y="1359" font-size="22" fill="#15345e" font-weight="700"><tspan x="633" dy="0">服务端接收</tspan></text><text x="633" y="1389" font-size="19" fill="#15345e" font-weight="400"><tspan x="633" dy="0">长度分帧 + ChatMessageDecoder</tspan></text><rect x="55" y="1415" width="500" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="73" y="1449" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">服务端回复：UTF-8 文本 + 换行</tspan></text><path d="M565,1447 L605,1447" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="615" y="1415" width="525" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="633" y="1449" font-size="22" fill="#15345e" font-weight="700"><tspan x="633" dy="0">客户端接收：按行分帧 + StringDecoder</tspan></text><text x="47" y="1557" font-size="22" fill="#15345e" font-weight="700"><tspan x="47" dy="0">StringEncoder 不自动补换行；每个方向的发送与接收格式必须配套。</tspan></text></g></svg>