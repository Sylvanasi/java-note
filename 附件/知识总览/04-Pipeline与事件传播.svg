<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">04｜Pipeline 与事件传播</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">先找节点，再看传播方向与操作起点</tspan></text><rect x="30" y="120" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  Pipeline、Handler 与 Context</tspan></text><rect x="55" y="190" width="340" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">Pipeline</tspan></text><text x="73" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">当前 Channel 的处理链</tspan></text><rect x="430" y="190" width="340" height="72" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">Handler</tspan></text><text x="448" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">提供处理方法的对象</tspan></text><rect x="805" y="190" width="340" height="72" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="823" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="823" dy="0">Context</tspan></text><text x="823" y="254" font-size="19" fill="#15345e" font-weight="400"><tspan x="823" dy="0">链上的节点与操作入口</tspan></text><text x="56" y="289" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">默认实现用 Context 双向链表组织 Handler；两个方向使用同一条链。</tspan></text><rect x="30" y="320" width="1140" height="235" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="320" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="356" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  入站、出站与处理器方向</tspan></text><text x="56" y="413" font-size="23" fill="#087f8c" font-weight="700"><tspan x="56" dy="0">入站</tspan></text><rect x="160" y="385" width="240" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="178" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="178" dy="0">分帧</tspan></text><rect x="490" y="385" width="240" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="508" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="508" dy="0">解码</tspan></text><rect x="820" y="385" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="838" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="838" dy="0">业务处理</tspan></text><path d="M410,417 L480,417" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M740,417 L810,417" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="496" font-size="23" fill="#7048c6" font-weight="700"><tspan x="56" dy="0">出站</tspan></text><rect x="160" y="465" width="240" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="178" y="499" font-size="22" fill="#15345e" font-weight="700"><tspan x="178" dy="0">网络写出</tspan></text><rect x="490" y="465" width="240" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="508" y="499" font-size="22" fill="#15345e" font-weight="700"><tspan x="508" dy="0">编码器</tspan></text><rect x="820" y="465" width="310" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="838" y="499" font-size="22" fill="#15345e" font-weight="700"><tspan x="838" dy="0">业务发起写</tspan></text><path d="M480,497 L410,497" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M810,497 L740,497" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="551" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">入站由 HEAD 向 TAIL；出站反向，跳过不适用的处理器。</tspan></text><rect x="30" y="575" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="575" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="611" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">3  入站如何继续传播</tspan></text><rect x="55" y="648" width="500" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="682" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">普通入站 Handler：fire 继续传播</tspan></text><rect x="590" y="648" width="550" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="608" y="682" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">解码器：加入 out，由父类传播</tspan></text><text x="56" y="739" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">默认适配器的 super 与 fire 通常二选一；同一事件不要重复转发。</tspan></text><rect x="30" y="775" width="1140" height="255" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="775" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="811" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">4  写操作起点与 Promise 透传</tspan></text><rect x="55" y="850" width="500" height="75" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="73" y="884" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">ctx.writeAndFlush</tspan></text><text x="73" y="914" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">从当前节点前面寻找出站 Handler</tspan></text><rect x="590" y="850" width="550" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="608" y="884" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">channel.writeAndFlush</tspan></text><text x="608" y="914" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">从 Pipeline 尾部发起写操作</tspan></text><text x="56" y="960" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">编码器应位于业务 Context 写路径前方；出站 Handler 用 ctx.write 继续。</tspan></text><rect x="55" y="977" width="1085" height="36" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="70" y="999" font-size="19" fill="#15345e" font-weight="400"><tspan x="70" dy="0">透传原 Promise，保留结果通知；从 Channel 重启可能再次经过自己。</tspan></text><rect x="30" y="1050" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1050" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1086" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">5  同步调用、任务提交与返回边界</tspan></text><rect x="55" y="1125" width="335" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">可直接执行目标回调</tspan></text><text x="73" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">当前线程调用</tspan></text><rect x="435" y="1125" width="335" height="72" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="453" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="453" dy="0">需要切换执行器</tspan></text><text x="453" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="453" dy="0">提交目标任务</tspan></text><rect x="815" y="1125" width="325" height="72" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="833" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="833" dy="0">调用已返回</tspan></text><text x="833" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="833" dy="0">不等于全链路完成</tspan></text><text x="56" y="1240" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">finally 只表示当前代码块退出；异步任务可能未完成，分帧也可能未输出。</tspan></text><text x="56" y="1270" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">跨线程日志顺序不能只按源码行顺序推断。</tspan></text><rect x="30" y="1300" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1300" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1336" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">6  日志粒度与读指针</tspan></text><rect x="55" y="1374" width="340" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1408" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">分帧前：观察字节事件</tspan></text><rect x="430" y="1374" width="340" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1408" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">分帧后：观察消息边界</tspan></text><rect x="805" y="1374" width="340" height="70" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="823" y="1408" font-size="22" fill="#15345e" font-weight="700"><tspan x="823" dy="0">解码后：观察业务字段</tspan></text><text x="56" y="1480" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">一次字节事件不等于一个 TCP 报文或业务消息；hexDump 不消耗读指针。</tspan></text><text x="47" y="1556" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习顺序：谁处理 → 往哪传播 → 从哪发起 → 何时真正完成</tspan></text></g></svg>