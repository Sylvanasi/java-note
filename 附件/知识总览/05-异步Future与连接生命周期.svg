<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="56" font-size="34" fill="#15345e" font-weight="700"><tspan x="45" dy="0">05｜异步 Future 与连接生命周期</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">操作完成、连接关闭、业务完成，是三个不同层次</tspan></text><rect x="30" y="120" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  ChannelFuture 表示一次操作的结果</tspan></text><rect x="55" y="191" width="335" height="73" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">成功</tspan></text><text x="73" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">isDone / isSuccess 为真</tspan></text><rect x="430" y="191" width="340" height="73" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="448" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">失败</tspan></text><text x="448" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">isDone 为真，检查 cause</tspan></text><rect x="810" y="191" width="335" height="73" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">取消</tspan></text><text x="828" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">isDone / isCancelled 为真</tspan></text><text x="56" y="297" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">调用返回不保证完成；Future 不是线程，也不代表连接的全部业务结束。</tspan></text><rect x="30" y="335" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="335" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="371" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  sync、await 与 addListener</tspan></text><rect x="55" y="410" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="444" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">sync：等待完成</tspan></text><text x="73" y="474" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">失败时传播异常</tspan></text><rect x="430" y="410" width="340" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="444" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">await：等待完成</tspan></text><text x="448" y="474" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">返回后仍需检查结果</tspan></text><rect x="810" y="410" width="335" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="444" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">addListener：登记通知</tspan></text><text x="828" y="474" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">不阻塞等待操作完成</tspan></text><text x="56" y="527" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">回调可能很快执行，也不一定在 main；避免阻塞 EventLoop 与监听器。</tspan></text><rect x="30" y="565" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="565" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="601" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  close 发起关闭，closeFuture 观察关闭</tspan></text><rect x="55" y="642" width="500" height="76" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="73" y="676" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">channel.close</tspan></text><text x="73" y="706" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">发起关闭请求，返回本次操作结果</tspan></text><rect x="590" y="642" width="550" height="76" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="608" y="676" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">channel.closeFuture</tspan></text><text x="608" y="706" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">观察该 Channel 关闭，不主动关闭</tspan></text><text x="56" y="747" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">可提前登记关闭监听；关闭通知不能证明 connect 成功或对端已保存消息。</tspan></text><rect x="30" y="780" width="1140" height="250" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="780" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="816" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  Channel 与 Handler 的生命周期事件</tspan></text><rect x="55" y="857" width="290" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="891" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">channelRegistered</tspan></text><rect x="430" y="857" width="300" height="68" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="891" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">channelActive</tspan></text><rect x="815" y="857" width="330" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="833" y="891" font-size="22" fill="#15345e" font-weight="700"><tspan x="833" dy="0">channelRead 等事件</tspan></text><path d="M355,891 L420,891" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M740,891 L805,891" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="945" width="430" height="65" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="73" y="979" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">channelInactive</tspan></text><path d="M495,977 L610,977" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="620" y="945" width="520" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="638" y="979" font-size="22" fill="#15345e" font-weight="700"><tspan x="638" dy="0">channelUnregistered</tspan></text><text x="56" y="1028" font-size="18" fill="#15345e" font-weight="400"><tspan x="56" dy="0">典型成功连接路径；handlerAdded / Removed 属于处理器生命周期。</tspan></text><rect x="30" y="1050" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1050" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1086" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  正常关闭与心跳超时的区别</tspan></text><rect x="55" y="1125" width="520" height="82" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">EOF 等明确 I/O 信号</tspan></text><text x="73" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">通常可及时处理，不必等心跳超时</tspan></text><rect x="610" y="1125" width="530" height="82" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="1159" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">长期没有期望的数据</tspan></text><text x="628" y="1189" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">超时可辅助识别，但空闲不等于死亡</tspan></text><text x="56" y="1245" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">半关闭不一定关闭整个 Channel；连接失活不等于监听端口关闭。</tspan></text><rect x="30" y="1285" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1285" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1321" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">6  线程组优雅关闭与资源所有权</tspan></text><rect x="55" y="1362" width="500" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1396" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">shutdownGracefully</tspan></text><text x="73" y="1426" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">发起停止；返回不代表线程已经退出</tspan></text><rect x="590" y="1362" width="550" height="80" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="608" y="1396" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">由资源所有者统一收尾</tspan></text><text x="608" y="1426" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">共享组不随某一条连接关闭</tspan></text><text x="56" y="1485" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">管理连接、任务与线程组，再观察终止结果；启动失败路径同样需要清理。</tspan></text><text x="56" y="1517" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">优雅关闭不自动保证事务完成、对端 ACK 或消息持久化。</tspan></text><text x="47" y="1584" font-size="24" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：哪个 Future？等什么结果？谁拥有资源？</tspan></text></g></svg>