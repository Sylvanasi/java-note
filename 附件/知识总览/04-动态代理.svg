<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1910" viewBox="0 0 1200 1910"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">动态代理</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">区分代理、目标、处理器，以及真正执行业务的对象</tspan></text><rect x="30" y="120" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  JDK 代理的对象与职责</tspan></text><rect x="55" y="190" width="335" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">proxy｜实现指定接口</tspan></text><rect x="430" y="190" width="340" height="67" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">handler｜处理调用</tspan></text><rect x="810" y="190" width="335" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">target｜执行业务</tspan></text><text x="56" y="283" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">创建 InvocationHandler 不执行 invoke；后续代理方法调用才触发处理器。</tspan></text><rect x="30" y="320" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="320" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="356" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  JDK 调用链与执行时点</tspan></text><rect x="55" y="395" width="310" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="429" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">proxy.send</tspan></text><path d="M375,430 L420,430" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="395" width="310" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="429" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">handler.invoke</tspan></text><path d="M750,430 L800,430" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="395" width="335" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="429" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">method.invoke target</tspan></text><text x="56" y="507" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">前置日志、目标业务、后置日志、返回结果；同一处理器可多次执行 invoke。</tspan></text><text x="56" y="537" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">void 目标反射返回 null；args 中的元素才是传给目标的参数。</tspan></text><rect x="30" y="560" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="560" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="596" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  生成的代理类如何转交调用</tspan></text><text x="56" y="656" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">JDK 生成类继承 Proxy、实现接口；每个代理方法转交处理器 h.invoke。</tspan></text><text x="56" y="693" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">Method 标识本次方法，args 保存本次参数；伪代码不是实际可编译源码。</tspan></text><rect x="30" y="755" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="755" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="791" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  处理器、返回值与异常语义</tspan></text><rect x="55" y="830" width="335" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="864" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">返回值</tspan></text><text x="73" y="894" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">基本类型不能返回 null</tspan></text><rect x="430" y="830" width="340" height="80" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="864" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">异常</tspan></text><text x="448" y="894" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">反射可能包装目标异常</tspan></text><rect x="810" y="830" width="335" height="80" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="828" y="864" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">递归</tspan></text><text x="828" y="894" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">委托 target，不重调自己</tspan></text><text x="56" y="953" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">InvocationTargetException 可能继续变成 UndeclaredThrowableException。</tspan></text><text x="56" y="987" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">清理放 finally；无参 args 可为 null，打印 proxy 也可能再次进入处理器。</tspan></text><rect x="30" y="1020" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1020" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1056" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  CGLIB 创建与拦截</tspan></text><rect x="55" y="1095" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1129" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">setSuperclass</tspan></text><path d="M375,1127 L420,1127" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="1095" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="1129" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">setCallback</tspan></text><path d="M750,1127 L800,1127" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="1095" width="335" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="1129" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">create 代理子类实例</tspan></text><text x="56" y="1197" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">MethodInterceptor.intercept 接收代理、方法、参数与 MethodProxy。</tspan></text><rect x="30" y="1230" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1230" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1266" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  CGLIB 子类调用与 this</tspan></text><rect x="55" y="1305" width="500" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1339" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">invokeSuper 进入父类原实现</tspan></text><text x="73" y="1369" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">手写示例中 this 仍是代理对象</tspan></text><rect x="610" y="1305" width="530" height="72" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="628" y="1339" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">父类不是另一份独立对象</tspan></text><text x="628" y="1369" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">内部虚调用可能再进入拦截器</tspan></text><text x="56" y="1418" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">不要套用到常规 Spring 独立 target 委托；先确认业务执行在哪个对象上。</tspan></text><rect x="30" y="1460" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1460" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1496" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  继承限制与代理适用边界</tspan></text><text x="56" y="1554" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">类代理受 final 类、final 方法、private、static 等继承与重写边界限制。</tspan></text><text x="56" y="1591" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">JDK 不继承目标实现类，接口调用仍可增强实现类中的 final 方法。</tspan></text><text x="56" y="1626" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">可见性、模块与配置也会影响代理；本次未运行限制与异常实验。</tspan></text><rect x="30" y="1660" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1660" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1696" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">8  JDK 与 CGLIB 对比</tspan></text><rect x="55" y="1732" width="520" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1766" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">JDK：接口 + InvocationHandler</tspan></text><rect x="610" y="1732" width="530" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="1766" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">CGLIB：子类 + MethodInterceptor</tspan></text><text x="56" y="1822" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">JDK 代理不能强转目标实现类；Spring 实际选择还受代理配置影响。</tspan></text><text x="47" y="1877" font-size="22" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：创建与调用分开；继承与委托分开；返回与异常都要传递。</tspan></text></g></svg>