<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">03｜EventLoop 与线程模型</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">先理解线程归属，再按编号查阅正文细节</tspan></text><rect x="30" y="120" width="1140" height="170" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  EventLoop 处理三类工作</tspan></text><rect x="55" y="188" width="340" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="222" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">网络就绪事件</tspan></text><rect x="430" y="188" width="340" height="68" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="222" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">普通任务</tspan></text><rect x="805" y="188" width="340" height="68" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="823" y="222" font-size="22" fill="#15345e" font-weight="700"><tspan x="823" dy="0">到期定时任务</tspan></text><text x="56" y="281" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">无工作时可等待 Selector；非阻塞 I/O 不等于线程始终忙轮询。</tspan></text><rect x="30" y="310" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="310" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="346" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  boss、worker 与连接的归属</tspan></text><rect x="55" y="385" width="265" height="84" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">boss EventLoop</tspan></text><text x="73" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">管理监听 Channel</tspan></text><rect x="430" y="385" width="300" height="84" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">worker EventLoop</tspan></text><text x="448" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">管理连接 A、B 的 I/O</tspan></text><path d="M325,427 L420,427" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="329" y="408" font-size="18" fill="#15345e" font-weight="400"><tspan x="329" dy="0">接受连接</tspan></text><rect x="830" y="385" width="310" height="84" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="848" y="419" font-size="22" fill="#15345e" font-weight="700"><tspan x="848" dy="0">连接 A / 连接 B</tspan></text><text x="848" y="449" font-size="19" fill="#15345e" font-weight="400"><tspan x="848" dy="0">各自有 Pipeline</tspan></text><path d="M735,427 L820,427" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="505" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">连接通常固定关联一个 EventLoop；一个 EventLoop 可以管理多个连接。</tspan></text><rect x="30" y="540" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="540" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="576" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">3  阻塞为何会影响其他连接</tspan></text><rect x="55" y="615" width="300" height="80" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="73" y="649" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">A 同步查库 3 秒</tspan></text><text x="73" y="679" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">占用共享 EventLoop</tspan></text><path d="M365,655 L430,655" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="440" y="615" width="320" height="80" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="458" y="649" font-size="22" fill="#15345e" font-weight="700"><tspan x="458" dy="0">EventLoop 无法及时推进</tspan></text><text x="458" y="679" font-size="19" fill="#15345e" font-weight="400"><tspan x="458" dy="0">其他工作需要等待</tspan></text><path d="M770,655 L825,655" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="835" y="615" width="305" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="853" y="649" font-size="22" fill="#15345e" font-weight="700"><tspan x="853" dy="0">B 与定时任务延迟</tspan></text><text x="853" y="679" font-size="19" fill="#15345e" font-weight="400"><tspan x="853" dy="0">独立 Pipeline 不能隔离线程</tspan></text><text x="56" y="730" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">同步 I/O、锁等待、sleep、长计算均需评估；轻量处理不必强制切线程。</tspan></text><rect x="30" y="765" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="765" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="801" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">4  业务执行器改变回调线程</tspan></text><rect x="55" y="837" width="495" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="871" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">网络注册：仍归 worker EventLoop</tspan></text><rect x="590" y="837" width="550" height="70" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="608" y="871" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">指定 Handler 回调：交给业务执行器</tspan></text><text x="56" y="934" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">业务执行器也有排队和顺序约束；不是每条消息创建一个线程。</tspan></text><rect x="30" y="965" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="965" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1001" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">5  后续 Handler 如何切回 EventLoop</tspan></text><rect x="55" y="1045" width="285" height="82" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1079" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">Handler A｜worker</tspan></text><text x="73" y="1109" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">传播到 B 时提交任务</tspan></text><path d="M350,1086 L420,1086" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="1045" width="305" height="82" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="448" y="1079" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">Handler B｜业务执行器</tspan></text><text x="448" y="1109" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">处理后再传播到 C</tspan></text><path d="M745,1086 L815,1086" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="825" y="1045" width="315" height="82" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="843" y="1079" font-size="22" fill="#15345e" font-weight="700"><tspan x="843" dy="0">Handler C｜worker</tspan></text><text x="843" y="1109" font-size="19" fill="#15345e" font-weight="400"><tspan x="843" dy="0">无另行指定执行器</tspan></text><text x="56" y="1163" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">worker 提交后可处理其他工作；消息等待传播，不等于 worker 阻塞等待。</tspan></text><rect x="30" y="1210" width="1140" height="235" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1210" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1246" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">6  定时任务与进程生命周期</tspan></text><rect x="55" y="1285" width="520" height="86" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="1319" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">定时任务仍在 EventLoop 执行</tspan></text><text x="73" y="1349" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">繁忙会延迟；示例 12 秒不是固定协议要求</tspan></text><rect x="610" y="1285" width="530" height="86" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="628" y="1319" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">默认启动的线程为非守护线程</tspan></text><text x="628" y="1349" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">线程存活时，main 返回不意味着 JVM 退出</tspan></text><text x="56" y="1416" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">退出时管理连接、周期任务与线程组；shutdownGracefully 之后观察终止。</tspan></text><text x="47" y="1503" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：I/O 归属 ≠ Handler 回调执行器；线程切换也有成本。</tspan></text></g></svg>