<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1630" viewBox="0 0 1200 1630"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">08｜分帧与入站解码</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">先拿到完整一帧，再消费字段并输出对象</tspan></text><rect x="30" y="120" width="1140" height="205" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  分帧确定范围，解码读取字段</tspan></text><rect x="55" y="191" width="310" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">原始字节流</tspan></text><text x="73" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">半帧先等待</tspan></text><path d="M375,228 L420,228" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="191" width="310" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">分帧后的 ByteBuf</tspan></text><text x="448" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">完整一帧</tspan></text><path d="M750,228 L800,228" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="191" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="225" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">业务解码</tspan></text><text x="828" y="255" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">得到 ChatMessage</tspan></text><text x="56" y="305" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">hello 先收到长度、类型和 he 时，保留等待 llo；多帧则逐条提取。</tspan></text><rect x="30" y="345" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="345" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="381" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  长度字段分帧器的五个参数</tspan></text><text x="56" y="443" font-size="25" fill="#15345e" font-weight="700"><tspan x="56" dy="0">LengthFieldBasedFrameDecoder「1024, 0, 4, 0, 4」</tspan></text><text x="56" y="484" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">整帧上限 1024  |  长度偏移 0  |  字段占 4 字节  |  修正 0  |  跳过 4 字节</tspan></text><text x="56" y="526" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">整帧 = N + 4；N 已含类型，不能再加 1；正文上限为 1019 字节。</tspan></text><text x="56" y="556" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">超长帧需异常策略；参数正确不等于所有非法帧已验证。</tspan></text><rect x="30" y="585" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="585" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="621" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  去掉长度字段后输出什么</tspan></text><rect x="55" y="658" width="500" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="73" y="692" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">strip = 4</tspan></text><text x="73" y="722" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">输出：类型 + 完整正文</tspan></text><rect x="590" y="658" width="550" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="608" y="692" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">strip = 0</tspan></text><text x="608" y="722" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">输出：长度 + 类型 + 完整正文</tspan></text><text x="56" y="751" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">输出仍为 ByteBuf；strip 不改变整帧长度计算，不自动生成业务对象。</tspan></text><rect x="30" y="785" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="785" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="821" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  ByteToMessageDecoder 的解析与输出</tspan></text><rect x="55" y="858" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="892" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">readByte</tspan></text><text x="73" y="922" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">消费类型</tspan></text><rect x="430" y="858" width="340" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="892" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">readBytes</tspan></text><text x="448" y="922" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">消费本帧正文</tspan></text><rect x="810" y="858" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="892" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">out.add</tspan></text><text x="828" y="922" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">父类传播业务对象</tspan></text><path d="M400,895 L420,895" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,895 L800,895" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="977" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">可能循环 decode；输出必须与读取进展一致，不重复 fire 同一结果。</tspan></text><text x="56" y="1003" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">空输入未必进入 decode：N 至少为 1 的合法性应在适当层明确校验。</tspan></text><rect x="30" y="1030" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1030" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1066" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">5  重复输出与乱码为何出现</tspan></text><rect x="55" y="1103" width="500" height="75" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="73" y="1137" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">错误：只 readByte，再 toString</tspan></text><text x="73" y="1167" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">正文没有消费，仍留在缓冲区</tspan></text><path d="M565,1140 L605,1140" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="615" y="1103" width="525" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="633" y="1137" font-size="22" fill="#15345e" font-weight="700"><tspan x="633" dy="0">再次解析把 h / e 当成类型</tspan></text><text x="633" y="1167" font-size="19" fill="#15345e" font-weight="400"><tspan x="633" dy="0">中文可能从 UTF-8 字节中间解码</tspan></text><text x="56" y="1221" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">修正读索引进展：readBytes 消费正文；前提仍是已经正确分帧。</tspan></text><rect x="30" y="1270" width="1140" height="250" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1270" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1306" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">6  解码器选择与状态生命周期</tspan></text><rect x="55" y="1344" width="520" height="88" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1378" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">ByteToMessageDecoder</tspan></text><text x="73" y="1408" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">字节累积与循环解析</tspan><tspan x="73" dy="23.75">实例不可跨连接共享</tspan></text><rect x="610" y="1344" width="530" height="88" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="1378" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">MessageToMessageDecoder</tspan></text><text x="628" y="1408" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">已分帧 ByteBuf 转对象</tspan><tspan x="628" dy="23.75">默认释放匹配的输入</tspan></text><text x="56" y="1471" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">同一连接复用 Decoder；成员状态需重置，已分帧时优先使用局部字段。</tspan></text><text x="56" y="1502" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">输出若共享输入内存，需保留对应引用；独立业务对象按其自身资源管理。</tspan></text><text x="47" y="1585" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：边界正确 → 消费正确 → 输出正确 → 引用与状态正确</tspan></text></g></svg>