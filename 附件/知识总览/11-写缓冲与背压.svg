<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2290" viewBox="0 0 1200 2290"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">11｜写缓冲与背压</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">以目标连接为单位：感知压力、有限暂存、恢复发送、结束结果</tspan></text><rect x="30" y="120" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  两端 Channel、积压与 TCP 窗口</tspan></text><rect x="55" y="190" width="320" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">Netty 待发送缓冲</tspan></text><path d="M385,225 L420,225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="190" width="320" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">本地 TCP 发送缓冲</tspan></text><path d="M760,225 L800,225" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="190" width="335" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">对端缓冲与应用读取</tspan></text><text x="56" y="293" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">两端有各自 Channel；rwnd / cwnd 间接影响排出，isWritable 不直接读取窗口。</tspan></text><rect x="30" y="330" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="330" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="366" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  背压信号、高低水位与事件</tspan></text><rect x="55" y="405" width="500" height="70" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="73" y="439" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">积压超过高水位 2048</tspan></text><text x="73" y="469" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">因水位变为不可写，通知业务减量</tspan></text><rect x="610" y="405" width="530" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="628" y="439" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">积压低于低水位 1024</tspan></text><text x="628" y="469" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">因水位恢复可写，唤醒待发消息</tspan></text><text x="56" y="512" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">区间内保留原状态；false 不会自动禁止 write，高水位不是硬内存上限。</tspan></text><text x="56" y="541" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">事件是通知，isWritable 是查询；回调读取当前值，不是变化瞬间快照。</tspan></text><rect x="30" y="570" width="1140" height="170" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="570" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="606" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  每个接收连接的队列与执行器</tspan></text><rect x="55" y="642" width="520" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="676" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">每个目标连接独立 PendingWriteHandler</tspan></text><rect x="610" y="642" width="530" height="67" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="628" y="676" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">队列回调在该连接 EventLoop 串行执行</tspan></text><text x="56" y="732" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">ChatHandler 可在业务执行器；出站经过发送 Handler，再编码与写出。</tspan></text><rect x="30" y="760" width="1140" height="225" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="760" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="796" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  有界队列与写入分支</tspan></text><rect x="55" y="835" width="335" height="78" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="73" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">失活：立即失败</tspan></text><text x="73" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">不再入队</tspan></text><rect x="430" y="835" width="340" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">可写且队列为空</tspan></text><text x="448" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">ctx.write 直接透传</tspan></text><rect x="810" y="835" width="335" height="78" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">否则：offer 入队</tspan></text><text x="828" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">满则失败并关闭目标</tspan></text><text x="56" y="954" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">保存 String 与原 Promise；容量 100 条，不是字节上限；不能阻塞 put。</tspan></text><text x="56" y="981" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">旧消息未排空时新消息进队尾，防止插队；直接写后不能再重复入队。</tspan></text><rect x="30" y="1005" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1005" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1041" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  恢复可写与排空边界</tspan></text><rect x="55" y="1078" width="310" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1112" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">检查可写与队列</tspan></text><path d="M375,1112 L420,1112" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="1078" width="310" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="1112" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">poll 最旧项并透传</tspan></text><path d="M750,1112 L800,1112" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="1078" width="335" height="68" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="1112" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">下一轮重新检查</tspan></text><text x="56" y="1175" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">停止追加后仍需 flush 已提交部分；需考虑批量上限与同步重入保护。</tspan></text><rect x="30" y="1210" width="1140" height="180" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1210" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1246" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  Promise 的保存、透传与完成</tspan></text><rect x="55" y="1283" width="335" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1317" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">入队：结果仍未完成</tspan></text><rect x="430" y="1283" width="340" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1317" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">补发：携带原 Promise</tspan></text><rect x="810" y="1283" width="335" height="67" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="1317" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">拒绝 / 关闭：tryFailure</tspan></text><text x="56" y="1377" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">不要入队就 trySuccess；Future 通知程序内调用者，不是向客户端发文本。</tspan></text><rect x="30" y="1410" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1410" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1446" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  连接关闭与队列清理</tspan></text><rect x="55" y="1485" width="520" height="68" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1519" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">channelInactive：失败并清空旧队列</tspan></text><rect x="610" y="1485" width="530" height="68" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="628" y="1519" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">随后新写任务：入口检查 isActive</tspan></text><text x="56" y="1585" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">串行回调仍可有随后到达的跨线程任务；重连不会完成旧连接的 Promise。</tspan></text><rect x="30" y="1620" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1620" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1656" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">8  群发结果与失败目标</tspan></text><rect x="55" y="1692" width="520" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1726" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">A 群发，B 过慢：由 B 的发送 Handler 处理</tspan></text><rect x="610" y="1692" width="530" height="67" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="628" y="1726" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">组回调的原 ctx 仍属于 A，不能误关 A</tspan></text><text x="56" y="1782" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">一项仍暂存时组结果可能未完成；组写成功不等于接收方业务 ACK。</tspan></text><rect x="30" y="1815" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1815" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1851" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">9  不同业务的背压策略</tspan></text><rect x="55" y="1887" width="335" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1921" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">状态数据：合并最新值</tspan></text><rect x="430" y="1887" width="340" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1921" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">批量数据：暂停源头</tspan></text><rect x="810" y="1887" width="335" height="67" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="1921" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">可靠消息：持久化与进度</tspan></text><text x="56" y="1977" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">不能无限暂存、直接跳过或在 EventLoop 上 sleep 等待恢复。</tspan></text><rect x="30" y="2010" width="1140" height="185" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="2010" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="2046" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">10  当前实现与验证边界</tspan></text><text x="56" y="2104" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">源码已有队列、恢复、Promise 与失活清理；未实现字节预算、等待超时、批量限制。</tspan></text><text x="56" y="2139" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">还需检查排空重入、Handler 移除与非 String 输入；本次未跑慢读及故障实验。</tspan></text><text x="56" y="2175" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">验收：正常透传、排队、恢复、队满、失活后写入、目标隔离与结果完成。</tspan></text><text x="47" y="2248" font-size="23" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：队列有界 + 顺序不乱 + Promise 不丢 + 关闭后不再等待</tspan></text></g></svg>