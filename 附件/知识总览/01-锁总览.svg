<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#ffffff"/><g font-family="PingFang SC, sans-serif" fill="#243247"><text x="50" y="46" font-size="28" font-weight="bold">InnoDB 锁：从访问冲突到事务处理</text><text x="50" y="78" font-size="17">1 模式决定兼容性 · 3 范围决定保护对象 · 2、4、5 决定实际行为 · 6 处理循环等待</text><rect x="50" y="115" width="540" height="170" rx="12" fill="#eaf3ff" stroke="#7292b3"/><text x="68" y="157" font-size="22">1. 锁模式：S 与 X</text><text x="68" y="196" font-size="18">S 与 S 兼容；X 与 S、X 冲突</text><text x="68" y="239" font-size="18">FOR SHARE 申请 S；FOR UPDATE 申请 X</text><rect x="610" y="115" width="540" height="170" rx="12" fill="#eaf3ff" stroke="#7292b3"/><text x="628" y="157" font-size="22">2. 读取方式与锁等待</text><text x="628" y="196" font-size="18">RC、RR 普通 SELECT 通常是快照读</text><text x="628" y="239" font-size="18">当前读申请冲突锁才等待；锁通常持有到事务结束</text><rect x="50" y="315" width="540" height="170" rx="12" fill="#eef8ef" stroke="#7292b3"/><text x="68" y="357" font-size="22">3. 记录、间隙与临键锁</text><text x="68" y="396" font-size="18">记录 20；间隙 (10,20)；临键 (10,20]</text><text x="68" y="439" font-size="18">临键 = 前方间隙 + 右端记录；范围由索引划分</text><rect x="610" y="315" width="540" height="170" rx="12" fill="#eef8ef" stroke="#7292b3"/><text x="628" y="357" font-size="22">4. SQL 如何决定锁范围</text><text x="628" y="396" font-size="18">唯一索引等值命中：可以只锁记录</text><text x="628" y="439" font-size="18">RR 查不存在的 15：保护相邻记录间隙 (10,20)</text><rect x="50" y="515" width="540" height="170" rx="12" fill="#fff5e8" stroke="#7292b3"/><text x="68" y="557" font-size="22">5. 开发中的悲观锁</text><text x="68" y="596" font-size="18">同一事务内：FOR UPDATE 查询、判断、修改</text><text x="68" y="639" font-size="18">竞争同一记录时排队；统一加锁顺序、缩短事务</text><rect x="610" y="515" width="540" height="170" rx="12" fill="#fff5e8" stroke="#7292b3"/><text x="628" y="557" font-size="22">6. 死锁检测与异常处理</text><text x="628" y="596" font-size="18">循环等待才是死锁；检测后选择事务整体回滚</text><text x="628" y="639" font-size="18">1213 / 40001；Java 收到异常，重试须用新事务</text></g></svg>