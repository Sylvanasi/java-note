<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">06｜ByteBuf 与内存管理</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">先看索引与内容，再看谁持有、谁交接、谁释放</tspan></text><rect x="30" y="120" width="1140" height="210" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  缓冲区与独立读写索引</tspan></text><rect x="55" y="190" width="335" height="67" rx="14" fill="#edf0f6" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">已读区域</tspan></text><rect x="390" y="190" width="390" height="67" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="408" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="408" dy="0">可读区域</tspan></text><rect x="780" y="190" width="365" height="67" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="798" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="798" dy="0">可写区域</tspan></text><text x="55" y="287" font-size="20" fill="#15345e" font-weight="400"><tspan x="55" dy="0">0</tspan></text><text x="300" y="287" font-size="20" fill="#15345e" font-weight="400"><tspan x="300" dy="0">readerIndex</tspan></text><text x="705" y="287" font-size="20" fill="#15345e" font-weight="400"><tspan x="705" dy="0">writerIndex</tspan></text><text x="1050" y="287" font-size="20" fill="#15345e" font-weight="400"><tspan x="1050" dy="0">capacity</tspan></text><text x="56" y="320" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">readableBytes = writerIndex − readerIndex；读过不等于释放。</tspan></text><rect x="30" y="350" width="1140" height="195" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="350" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="386" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  读取、查看与 EOF 的区别</tspan></text><rect x="55" y="422" width="500" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="456" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">read / skip：移动读索引</tspan></text><text x="73" y="486" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">readInt 消费 4 字节</tspan></text><rect x="590" y="422" width="550" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="608" y="456" font-size="22" fill="#15345e" font-weight="700"><tspan x="608" dy="0">get / toString / hexDump：不移动</tspan></text><text x="608" y="486" font-size="19" fill="#15345e" font-weight="400"><tspan x="608" dy="0">查看内容不等于消费字节</tspan></text><text x="56" y="530" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">readByte 的 −1 可为真实数据 0xFF；无足够字节时抛越界异常，不是 EOF。</tspan></text><rect x="30" y="565" width="1140" height="230" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="565" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="601" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  复制与共享视图</tspan></text><rect x="55" y="641" width="335" height="92" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="675" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">copy / readBytes「n」</tspan></text><text x="73" y="705" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">复制内容</tspan><tspan x="73" dy="23.75">新 ByteBuf 需要释放</tspan></text><rect x="430" y="641" width="340" height="92" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="448" y="675" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">slice / duplicate</tspan></text><text x="448" y="705" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">共享内容、独立索引</tspan><tspan x="448" dy="23.75">通常不增加引用计数</tspan></text><rect x="810" y="641" width="335" height="92" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="675" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">retained 视图</tspan></text><text x="828" y="705" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">共享内容、额外引用</tspan><tspan x="828" dy="23.75">需要配对释放</tspan></text><text x="56" y="776" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">readSlice 会移动源读索引；共享视图不是独立快照。</tspan></text><rect x="30" y="815" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="815" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="851" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  retain 与 release 管理资源生命周期</tspan></text><rect x="55" y="890" width="335" height="70" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="924" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">通常初始计数 1</tspan></text><rect x="430" y="890" width="340" height="70" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="924" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">retain：增加引用</tspan></text><rect x="810" y="890" width="335" height="70" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="924" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">release：减少引用</tspan></text><path d="M400,925 L420,925" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M780,925 L800,925" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="56" y="998" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">降至 0 回收或归还资源；retain 不复制、不冻结索引，也不提供线程安全。</tspan></text><rect x="30" y="1035" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1035" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1071" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  Handler 的释放责任</tspan></text><rect x="55" y="1110" width="335" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1144" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">原样向下游传播</tspan></text><text x="73" y="1174" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">交接原引用</tspan></text><rect x="430" y="1110" width="340" height="78" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1144" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">自己消费并结束</tspan></text><text x="448" y="1174" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">释放输入</tspan></text><rect x="810" y="1110" width="335" height="78" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="828" y="1144" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">自己额外 retain</tspan></text><text x="828" y="1174" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">额外引用配对 release</tspan></text><text x="56" y="1230" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">SimpleChannelInboundHandler 默认释放匹配输入；继续转发需保留引用。</tspan></text><rect x="30" y="1275" width="1140" height="220" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1275" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1311" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  日志观察与异步交接</tspan></text><rect x="55" y="1350" width="520" height="80" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1384" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">优先在交接前生成日志快照</tspan></text><text x="73" y="1414" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">hexDump 不移动索引；字符串独立保存</tspan></text><rect x="610" y="1350" width="530" height="80" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="628" y="1384" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">异步任务要明确引用交接</tspan></text><text x="628" y="1414" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">任务拒绝、异常与并发访问都需处理</tspan></text><text x="56" y="1472" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">retain 后计数未归零不一定泄漏；分帧器可能仍持有未完成数据。</tspan></text><text x="47" y="1559" font-size="24" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：索引变化 ≠ 内容复制 ≠ 引用计数变化</tspan></text></g></svg>