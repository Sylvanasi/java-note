<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2250" viewBox="0 0 1200 2250"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#f8fbff"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="58" font-size="36" fill="#15345e" font-weight="700"><tspan x="45" dy="0">TCP 核心知识</tspan></text><text x="47" y="98" font-size="22" fill="#087f8c" font-weight="400"><tspan x="47" dy="0">可靠、有序、全双工字节流；业务语义与消息边界由应用负责</tspan></text><rect x="30" y="120" width="1140" height="175" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="120" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="156" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">1  TCP 在解决什么问题</tspan></text><rect x="55" y="190" width="335" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">面向连接</tspan></text><rect x="430" y="190" width="340" height="65" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">可靠、有序字节流</tspan></text><rect x="810" y="190" width="335" height="65" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="828" y="224" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">全双工</tspan></text><text x="56" y="281" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">TCP 位于 IP 之上；不保留 write 边界，不保证业务处理成功。</tspan></text><rect x="30" y="315" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="315" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="351" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">2  连接、角色与四元组</tspan></text><rect x="55" y="390" width="335" height="73" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">客户端发 SYN</tspan></text><path d="M400,426 L420,426" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="390" width="340" height="73" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">服务端回 SYN + ACK</tspan></text><path d="M780,426 L800,426" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="390" width="335" height="73" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="424" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">客户端回 ACK</tspan></text><text x="56" y="500" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">四元组：源 IP、源端口、目标 IP、目标端口；accept 接受连接，不是消息。</tspan></text><text x="56" y="526" font-size="19" fill="#15345e" font-weight="400"><tspan x="56" dy="0">握手确认序号与参数；建立连接不代表业务登录已成功。</tspan></text><rect x="30" y="550" width="1140" height="190" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="550" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="586" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">3  数据从程序到程序经过了什么</tspan></text><rect x="55" y="625" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="659" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">本机应用与缓冲</tspan></text><path d="M375,657 L420,657" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="430" y="625" width="310" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="448" y="659" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">TCP 内核与网络</tspan></text><path d="M750,657 L800,657" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="625" width="335" height="65" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="659" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">对端缓冲与应用读取</tspan></text><text x="56" y="727" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">write 返回、TCP 收到、read、分帧、业务成功是不同结果。</tspan></text><rect x="30" y="760" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="760" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="796" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">4  可靠传输：序号、ACK、乱序与重传</tspan></text><rect x="55" y="835" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">按字节编号</tspan></text><text x="73" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">ACK=103：下一期望103</tspan></text><rect x="430" y="835" width="340" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">乱序先暂存</tspan></text><text x="448" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">缺口阻塞后续字节交付</tspan></text><rect x="810" y="835" width="335" height="75" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="828" y="869" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">重传与去重</tspan></text><text x="828" y="899" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">重传不等于重连</tspan></text><text x="56" y="952" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">ACK 丢失或延迟也会导致未确认；TCP 不把重传字节重复交付给应用。</tspan></text><rect x="30" y="995" width="1140" height="245" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="995" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1031" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">5  流量控制与拥塞控制</tspan></text><rect x="55" y="1070" width="520" height="78" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1104" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">rwnd｜接收方通告</tspan></text><text x="73" y="1134" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">保护接收缓冲区</tspan></text><rect x="610" y="1070" width="530" height="78" rx="14" fill="#f3effc" stroke="#cbd9ec"/><text x="628" y="1104" font-size="22" fill="#15345e" font-weight="700"><tspan x="628" dy="0">cwnd｜发送方维护</tspan></text><text x="628" y="1134" font-size="19" fill="#15345e" font-weight="400"><tspan x="628" dy="0">约束网络中的未确认数据量</tspan></text><text x="56" y="1191" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">简化额度：max「0, min「rwnd, cwnd」− 未确认字节数」。</tspan></text><text x="56" y="1224" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">零窗口可形成背压；慢启动、拥塞避免、快速恢复以经典算法为例。</tspan></text><rect x="30" y="1260" width="1140" height="200" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1260" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1296" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">6  TCP 是字节流，不会替你分消息</tspan></text><rect x="55" y="1334" width="335" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1368" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">半包 / 多消息合并</tspan></text><text x="73" y="1398" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">read 范围不是消息边界</tspan></text><rect x="430" y="1334" width="340" height="72" rx="14" fill="#eaf8f3" stroke="#cbd9ec"/><text x="448" y="1368" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">分帧</tspan></text><text x="448" y="1398" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">长度、分隔符或固定长度</tspan></text><rect x="810" y="1334" width="335" height="72" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="828" y="1368" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">UTF-8 解码</tspan></text><text x="828" y="1398" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">完整正文或增量状态</tspan></text><text x="56" y="1445" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">字节数不等于字符数；任意读取片段分别 new String 可能破坏字符。</tspan></text><rect x="30" y="1480" width="1140" height="215" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1480" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1516" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">7  连接关闭：FIN、TIME_WAIT 与 RST</tspan></text><rect x="55" y="1555" width="335" height="75" rx="14" fill="#edf5ff" stroke="#cbd9ec"/><text x="73" y="1589" font-size="22" fill="#15345e" font-weight="700"><tspan x="73" dy="0">FIN：结束一个发送方向</tspan></text><text x="73" y="1619" font-size="19" fill="#15345e" font-weight="400"><tspan x="73" dy="0">另一方向仍可发送</tspan></text><rect x="430" y="1555" width="340" height="75" rx="14" fill="#fff3e6" stroke="#cbd9ec"/><text x="448" y="1589" font-size="22" fill="#15345e" font-weight="700"><tspan x="448" dy="0">TIME_WAIT</tspan></text><text x="448" y="1619" font-size="19" fill="#15345e" font-weight="400"><tspan x="448" dy="0">确认重传 FIN，隔离旧报文</tspan></text><rect x="810" y="1555" width="335" height="75" rx="14" fill="#fff0f0" stroke="#cbd9ec"/><text x="828" y="1589" font-size="22" fill="#15345e" font-weight="700"><tspan x="828" dy="0">RST：中止连接</tspan></text><text x="828" y="1619" font-size="19" fill="#15345e" font-weight="400"><tspan x="828" dy="0">不走正常挥手</tspan></text><text x="56" y="1670" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">TIME_WAIT 不是等待 ACK 的 ACK；FIN 与 ACK 可合并，报文数不固定。</tspan></text><rect x="30" y="1715" width="1140" height="150" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1715" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1751" font-size="26" fill="#087f8c" font-weight="700"><tspan x="50" dy="0">8  TCP 与 BIO、NIO 的关系</tspan></text><text x="56" y="1814" font-size="23" fill="#15345e" font-weight="400"><tspan x="56" dy="0">TCP 是传输协议；BIO / NIO 是应用使用 I/O 的编程模型。</tspan></text><text x="56" y="1847" font-size="20" fill="#15345e" font-weight="400"><tspan x="56" dy="0">两种模型都需处理分帧、超时、慢连接、资源清理与业务确认。</tspan></text><rect x="30" y="1885" width="1140" height="140" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="1885" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="1921" font-size="26" fill="#7048c6" font-weight="700"><tspan x="50" dy="0">9  高频误区</tspan></text><text x="56" y="1979" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">可靠传输 ≠ 业务成功；一次 read ≠ 一条消息；rwnd / cwnd ≠ 上下行。</tspan></text><rect x="30" y="2045" width="1140" height="130" rx="14" fill="#ffffff" stroke="#cbd9ec"/><rect x="30" y="2045" width="1140" height="54" rx="14" fill="#edf4fc" stroke="#cbd9ec"/><text x="50" y="2081" font-size="26" fill="#2563eb" font-weight="700"><tspan x="50" dy="0">10  自测与答案</tspan></text><text x="56" y="2137" font-size="21" fill="#15345e" font-weight="400"><tspan x="56" dy="0">保留10道自测与答案：层次、连接、ACK、窗口、分帧与关闭。</tspan></text><text x="47" y="2217" font-size="22" fill="#15345e" font-weight="700"><tspan x="47" dy="0">复习重点：传输保证、应用责任、缓冲压力与关闭语义分别判断。</tspan></text></g></svg>