<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3b82f6"/></marker></defs><rect width="1200" height="1330" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="600" y="53.0" font-size="28" fill="#1e40af" text-anchor="middle">康佳合同全生命周期平台 · 业务流程</text><text x="600" y="86.0" font-size="18" fill="#374151" text-anchor="middle">复习顺序：合同怎么流转 → 财务结果怎么回来 → 风险怎么冻结与恢复</text><rect x="30" y="115" width="1140" height="250" rx="18" fill="#f8fafc" stroke="#d9e3f0"/><text x="55" y="155.0" font-size="22" fill="#1e40af" text-anchor="start">01  平台全貌｜合同的一生</text><text x="55" y="183.0" font-size="16" fill="#374151" text-anchor="start">平台背景；本人重点负责下方两块集成业务。收付款与开票可随履约分阶段发生。</text><rect x="55" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="137.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">合同预审</text><text x="137.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">非格式文本定稿</text><path d="M220,251 L235,251" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="240" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="322.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">合同申报</text><text x="322.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">相对方／结算计划</text><path d="M405,251 L420,251" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="425" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="507.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">审批与签订</text><text x="507.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">驳回／作废处理</text><path d="M590,251 L605,251" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="610" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="692.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">合同归档</text><text x="692.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">共享侧确认</text><path d="M775,251 L790,251" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="795" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="877.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">履约与验收</text><text x="877.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">分阶段、多次验收</text><path d="M960,251 L975,251" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="980" y="215" width="165" height="72" rx="12" fill="#a5d8ff" stroke="#3b82f6" stroke-width="1.5"/><text x="1062.5" y="246.5" font-size="18" fill="#374151" text-anchor="middle">收付款／开票</text><text x="1062.5" y="269.0" font-size="18" fill="#374151" text-anchor="middle">履约完成后关闭</text><text x="55" y="324.0" font-size="17" fill="#374151" text-anchor="start">关键规则：需要保证金的合同，未收齐不允许履约；合同状态同步财务共享／SAP。</text><rect x="30" y="390" width="1140" height="330" rx="18" fill="#f8fafc" stroke="#d9e3f0"/><text x="55" y="430.0" font-size="22" fill="#1e40af" text-anchor="start">02  本人负责｜财务共享接口与台账</text><text x="55" y="458.0" font-size="16" fill="#374151" text-anchor="start">财务业务在共享侧办理；OA 接收数据、关联所属合同、展示业务结果。</text><rect x="65" y="490" width="260" height="100" rx="12" fill="#ffd8a8" stroke="#3b82f6" stroke-width="1.5"/><text x="195.0" y="524.25" font-size="18" fill="#374151" text-anchor="middle">财务共享</text><text x="195.0" y="546.75" font-size="18" fill="#374151" text-anchor="middle">付款状态／收款结算计划</text><text x="195.0" y="569.25" font-size="18" fill="#374151" text-anchor="middle">发票／保证金回传</text><rect x="415" y="490" width="300" height="100" rx="12" fill="#d0bfff" stroke="#3b82f6" stroke-width="1.5"/><text x="565.0" y="524.25" font-size="18" fill="#374151" text-anchor="middle">OA 接收回传</text><text x="565.0" y="546.75" font-size="18" fill="#374151" text-anchor="middle">按合同及相关明细关联</text><text x="565.0" y="569.25" font-size="18" fill="#374151" text-anchor="middle">更新业务状态／生成计划</text><rect x="805" y="490" width="320" height="100" rx="12" fill="#c3fae8" stroke="#3b82f6" stroke-width="1.5"/><text x="965.0" y="524.25" font-size="18" fill="#374151" text-anchor="middle">OA 台账展示</text><text x="965.0" y="546.75" font-size="18" fill="#374151" text-anchor="middle">收付款台账 ＋ 发票台账</text><text x="965.0" y="569.25" font-size="18" fill="#374151" text-anchor="middle">保证金等更新对应业务记录</text><path d="M325,540 L405,540" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><path d="M715,540 L795,540" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="65" y="633.0" font-size="17" fill="#374151" text-anchor="start">查询：合同页签／独立菜单 → 按所属合同阅读权限过滤 → 点击跳转财务共享单据。</text><text x="65" y="674.0" font-size="17" fill="#374151" text-anchor="start">申报侧另有：事前费用申请变更对接；选择预算控制时带出事前申请单与招标信息。</text><rect x="30" y="745" width="1140" height="470" rx="18" fill="#f8fafc" stroke="#d9e3f0"/><text x="55" y="785.0" font-size="22" fill="#1e40af" text-anchor="start">03  本人负责｜相对方冻结与解冻</text><text x="55" y="813.0" font-size="16" fill="#374151" text-anchor="start">相对方 = 供应商／客户。出现纠纷或征信、经营风险时，暂停相关业务往来。</text><rect x="65" y="845" width="250" height="80" rx="12" fill="#ffd8a8" stroke="#3b82f6" stroke-width="1.5"/><text x="190.0" y="880.5" font-size="18" fill="#374151" text-anchor="middle">法务发起冻结申请</text><text x="190.0" y="903.0" font-size="18" fill="#374151" text-anchor="middle">上传依据、选定在途合同</text><rect x="385" y="845" width="260" height="80" rx="12" fill="#ffc9c9" stroke="#3b82f6" stroke-width="1.5"/><text x="515.0" y="880.5" font-size="18" fill="#374151" text-anchor="middle">冻结相对方</text><text x="515.0" y="903.0" font-size="18" fill="#374151" text-anchor="middle">锁定选定的在途合同</text><rect x="725" y="845" width="390" height="80" rx="12" fill="#b2f2bb" stroke="#3b82f6" stroke-width="1.5"/><text x="920.0" y="880.5" font-size="18" fill="#374151" text-anchor="middle">风险解除 → 解冻审批完成</text><text x="920.0" y="903.0" font-size="18" fill="#374151" text-anchor="middle">一次性恢复全部锁定内容</text><path d="M315,885 L375,885" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><path d="M645,885 L715,885" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><path d="M920,925 L920,970" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="725" y="980" width="390" height="65" rx="12" fill="#d0bfff" stroke="#3b82f6" stroke-width="1.5"/><text x="920.0" y="1008.0" font-size="18" fill="#374151" text-anchor="middle">按原冻结账套推送 MDM</text><text x="920.0" y="1030.5" font-size="18" fill="#374151" text-anchor="middle">由 MDM 同步 SAP 客商解冻</text><path d="M725,1012 L665,1012" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="385" y="980" width="270" height="65" rx="12" fill="#c3fae8" stroke="#3b82f6" stroke-width="1.5"/><text x="520.0" y="1008.0" font-size="18" fill="#374151" text-anchor="middle">解锁财务共享侧</text><text x="520.0" y="1030.5" font-size="18" fill="#374151" text-anchor="middle">对应合同的锁定状态</text><path d="M920,1045 L920,1085" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="725" y="1095" width="390" height="65" rx="12" fill="#fff3bf" stroke="#3b82f6" stroke-width="1.5"/><text x="920.0" y="1123.0" font-size="18" fill="#374151" text-anchor="middle">抄送集团采购成本管理部</text><text x="920.0" y="1145.5" font-size="18" fill="#374151" text-anchor="middle">协同处理 SRM 供应商</text><text x="65" y="1118.0" font-size="18" fill="#1e40af" text-anchor="start">解冻后的三项协同动作</text><text x="65" y="1151.0" font-size="16" fill="#374151" text-anchor="start">图中分开展示，不表示固定执行先后。</text><text x="600" y="1263.0" font-size="18" fill="#374151" text-anchor="middle">跨系统推送底座：异步定时任务队列｜记录执行次数、请求与响应｜支持重试和延迟执行</text><text x="600" y="1300.0" font-size="16" fill="#374151" text-anchor="middle">依据：康佳-业务简版.md ｜ 业务复习图，不展开具体接口与代码实现</text></g></svg>